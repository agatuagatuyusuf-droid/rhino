name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-validate:
    name: Build, test and validate (${{ matrix.display_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            display_name: Windows
          - os: macos-14
            platform: macos
            display_name: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show environment
        shell: pwsh
        run: |
          dotnet --info
          python --version
          git --version
          pwsh --version

      - name: Run complete validation
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/run_validation.ps1 -Platform ${{ matrix.platform }}
