name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-validate:
    name: Build, test and validate (${{ matrix.display_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            display_name: Windows
          - os: macos-14
            platform: macos
            display_name: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show environment
        shell: pwsh
        run: |
          dotnet --info
          python --version
          git --version
          pwsh --version

      - name: Derive SOURCE_COMMIT and TESTED_COMMIT
        shell: pwsh
        run: |
          # SOURCE_COMMIT = the commit whose code IS checked out (branch head on PR)
          $sourceCommit = "${{ github.event.pull_request.head.sha || github.sha }}"
          # TESTED_COMMIT = the merge commit that CI actually tests (github.sha on PR)
          # On push: both are github.sha
          $testedCommit = "${{ github.sha }}"

          $sourceShort = $sourceCommit.Substring(0, 7)
          $testedShort = $testedCommit.Substring(0, 7)

          echo "SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "SOURCE_COMMIT_SHORT=$sourceShort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "TESTED_COMMIT=$testedCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "TESTED_COMMIT_SHORT=$testedShort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GITHUB_EVENT=${{ github.event_name }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          echo "SOURCE_COMMIT=$sourceCommit"
          echo "SOURCE_COMMIT_SHORT=$sourceShort"
          echo "TESTED_COMMIT=$testedCommit"
          echo "TESTED_COMMIT_SHORT=$testedShort"
          echo "GITHUB_EVENT=${{ github.event_name }}"

      - name: Run complete validation
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/run_validation.ps1 -Platform ${{ matrix.platform }}

      - name: Package Windows net7.0
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python tools/package_test_artifacts.py --platform windows --framework net7.0 --source-commit "${{ env.SOURCE_COMMIT }}" --tested-commit "${{ env.TESTED_COMMIT }}" --github-event "${{ env.GITHUB_EVENT }}"

      - name: Check Windows net7.0 package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python tools/check_test_package.py --path ci-artifacts/RCP-windows-net7.0-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }} --commit "${{ env.TESTED_COMMIT }}"

      - name: Upload Windows net7.0 artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: RCP-windows-net7.0-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }}
          path: ci-artifacts/RCP-windows-net7.0-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }}/
          retention-days: 14

      - name: Package Windows net48
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python tools/package_test_artifacts.py --platform windows --framework net48 --source-commit "${{ env.SOURCE_COMMIT }}" --tested-commit "${{ env.TESTED_COMMIT }}" --github-event "${{ env.GITHUB_EVENT }}"

      - name: Check Windows net48 package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python tools/check_test_package.py --path ci-artifacts/RCP-windows-net48-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }} --commit "${{ env.TESTED_COMMIT }}"

      - name: Upload Windows net48 artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: RCP-windows-net48-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }}
          path: ci-artifacts/RCP-windows-net48-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }}/
          retention-days: 14

      - name: Package macOS net7.0
        if: matrix.platform == 'macos'
        shell: pwsh
        run: python tools/package_test_artifacts.py --platform macos --framework net7.0 --source-commit "${{ env.SOURCE_COMMIT }}" --tested-commit "${{ env.TESTED_COMMIT }}" --github-event "${{ env.GITHUB_EVENT }}"

      - name: Check macOS net7.0 package
        if: matrix.platform == 'macos'
        shell: pwsh
        run: python tools/check_test_package.py --path ci-artifacts/RCP-macos-net7.0-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }} --commit "${{ env.TESTED_COMMIT }}"

      - name: Upload macOS net7.0 artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: RCP-macos-net7.0-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }}
          path: ci-artifacts/RCP-macos-net7.0-src-${{ env.SOURCE_COMMIT_SHORT }}-test-${{ env.TESTED_COMMIT_SHORT }}/
          retention-days: 14
